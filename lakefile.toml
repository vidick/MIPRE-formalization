name = "MIPRE"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MIPRE", "Palomar"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# Pinned to the toolchain tag rather than `main` so that doc-gen4 always
# matches `lean-toolchain`; bump both together (see scripts/update.sh).
[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.35.0-rc3"

# The low individual degree test (`planning/lidt-port.md`, `planning/palomar-dependencies.md`):
# Sirui Lu, Ruixuan Deng and Zhengfeng Ji's formalization, the substantive development behind
# Palomar entry PALOMAR-2026-08-18-000001, as a pinned Git dependency. Only
# `MIPRE/Background/LIDT/Bridge/` and the commuting-operator port under
# `MIPRE/Background/LIDT/Co/` import it; its main theorem `MIPStarRE.LDT.Test.mainFormal` is
# the only result the bridge consumes.
[[require]]
name = "MIPStarRE"
git = "https://github.com/LionSR/MIPStarRE"
rev = "5fc363bc8b77b1a6bbdaaeea634f1b0f3ff0ad79"

[[lean_lib]]
name = "MIPRE"

# The Palomar submission (`planning/palomar.md`): the Mathlib-only statement file, the
# library-side bridge, and the Solution that proves the Challenge's theorems by transport.
[[lean_lib]]
name = "Palomar"
roots = ["Palomar.Challenge", "Palomar.Bridge", "Palomar.Solution"]
