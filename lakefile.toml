name = "MIPRE"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MIPRE", "Palomar"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# Pinned to the toolchain tag rather than `main` so that doc-gen4 always
# matches `lean-toolchain`; bump both together (see scripts/update.sh).
[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.35.0-rc3"

# The low individual degree test (`planning/lidt-port.md`, `planning/palomar-dependencies.md`):
# Sirui Lu, Ruixuan Deng and Zhengfeng Ji's formalization, the substantive development behind
# Palomar entry PALOMAR-2026-08-18-000001, as a pinned Git dependency. Only
# `MIPRE/Background/LIDT/Bridge/` and the commuting-operator port under
# `MIPRE/Background/LIDT/Co/` import it; its main theorem `MIPStarRE.LDT.Test.mainFormal` is
# the only result the bridge consumes.
[[require]]
name = "MIPStarRE"
git = "https://github.com/LionSR/MIPStarRE"
rev = "5fc363bc8b77b1a6bbdaaeea634f1b0f3ff0ad79"

[[lean_lib]]
name = "MIPRE"

# The Palomar submission (`planning/palomar.md`): the Mathlib-only statement file, the
# library-side bridge, and the Solution that proves the Challenge's theorems by transport.
[[lean_lib]]
name = "Palomar"
roots = ["Palomar.Challenge", "Palomar.Bridge", "Palomar.Solution"]

# The blueprint's declaration checker, `lake exe checkdecls blueprint/lean_decls`
# (`scripts/CheckBlueprintDecls.lean`): the documentation deploy runs it on `main` right after
# `leanblueprint web`, and `Build project` runs it on every pull request. The project's own
# executable rather than the `PatrickMassot/checkdecls` dependency it required until
# 2026-10-14, for two reasons. That program imports every library root of the package into
# one environment, and the Palomar `Challenge` and `Solution` roots declare the same names,
# so the import fails. And
# the `MIPStarRE` dependency ships a `checkdecls` executable of its own, which `lake exe`
# otherwise finds first and which checks the names against that project's library; Lake
# searches the root package first, so this one shadows it. Between them the two kept the
# deploy red, and the published blueprint stale, from 2026-09-29 to 2026-10-14.
[[lean_exe]]
name = "checkdecls"
root = "CheckBlueprintDecls"
srcDir = "scripts"
supportInterpreter = true
