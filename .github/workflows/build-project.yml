name: Build MIPRE

# No path filters: "Build project" is a required status check on main, and a
# filtered-out workflow never reports, which would block blueprint-only PRs
# indefinitely (lesson learned in the MIPRE-test repository).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# Keyed to the commit, not the ref, and deliberately so. "Build project" is a
# required status check, and a cancelled run reports nothing — exactly as bad as
# the filtered-out run warned about above. With `group: github.ref` every run for
# a PR shares one group, so a run for an *older* head that starts late cancels the
# run for the newer head, and the required check is then permanently missing for
# the commit being merged: observed on PR #36, where a reopen and a push 45
# seconds apart left the head with a cancelled run and an unmergeable PR. Keying
# the group to the head SHA means runs for different commits never cancel each
# other; duplicate runs for the *same* commit still collapse, which is what the
# saving was actually for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and modify PR labels
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    # `contents: write` is for the prebuilt-bundle upload in the last step,
    # which runs only on pushes to `main`. This job deploys nothing, so it does
    # not need the `pages`/`id-token` scopes declared above.
    permissions:
      contents: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Pure-Python, seconds: these catch blueprint/Lean drift before the Lean
      # build starts, and are the only feedback a blueprint-only PR gets (the
      # blueprint itself builds on main only).
      - name: Blueprint and Lean-coverage checks
        run: |
          python3 scripts/ledger-sync.py
          python3 scripts/lean-coverage.py --check

      - name: Install and configure Lean, and get mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: "Check that MIPRE.lean is up to date"
        run: |
          ~/.elan/bin/lake exe mk_all --check || { echo "ERROR: please ensure that MIPRE.lean is up to date, for instance by running lake exe mk_all"; exit 1; }

      # The commit is in the key so that every run writes a fresh entry and the
      # restore-keys ladder picks the newest earlier build of the same toolchain
      # and dependency pins. Keyed on the two hashes alone, the cache is written
      # once and never again, so it falls further behind `main` with every merge
      # until the next toolchain or Mathlib bump.
      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: .lake/build
          key: LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            LakeBuild-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            LakeBuild-${{ runner.os }}-
            LakeBuild-

      - name: Build project
        run: ~/.elan/bin/lake build MIPRE

      # Cloud sessions cannot build these modules for themselves: a cloud
      # environment's setup script has about five minutes, of which fetching the
      # Mathlib olean cache already takes two, while building all 533 modules
      # takes 30 to 45. So `main` publishes them here and
      # `.claude/cloud-setup.sh` downloads this asset into the snapshot instead
      # (see docs/lean-cloud.md). Lake's traces are path-independent — an olean
      # built on a runner replays in /opt/warm on a session VM — so this is the
      # same trick as Mathlib's own `lake exe cache get`.
      - name: Publish the prebuilt module bundle
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        # "Build project" is a required check and this step is an optimisation
        # for cloud sessions, not a gate: a failed upload is an annotation on the
        # run, and the session hook says "no MIPRE modules prebuilt" if it stays
        # broken. It must never turn a green build red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: prebuilt-main
        run: |
          set -euo pipefail
          mathlib=$(python3 -c "import json; print(next(p['rev'] for p in json.load(open('lake-manifest.json'))['packages'] if p['name'] == 'mathlib'))")
          # Travels inside the bundle so a session can say what it is holding.
          # Lake ignores files it does not know about under .lake/build.
          cat > .lake/build/BUNDLE-INFO <<EOF
          commit: ${{ github.sha }}
          toolchain: $(cat lean-toolchain)
          mathlib: $mathlib
          oleans: $(find .lake/build/lib -name '*.olean' | wc -l)
          built-at: $(date -u +%FT%TZ)
          EOF
          tar --use-compress-program 'zstd -T0 -3' -cf mipre-build.tar.zst .lake/build
          size=$(stat -c%s mipre-build.tar.zst)
          echo "bundle: $(numfmt --to=iec "$size"), $(grep '^oleans:' .lake/build/BUNDLE-INFO)"
          # A release asset has to stay under 2 GiB. Warn rather than fail: the
          # build itself succeeded, and a stale bundle is better than a red run.
          if [ "$size" -gt 2040109465 ]; then
            echo "::warning::prebuilt bundle is $(numfmt --to=iec "$size"), over the 2 GiB release-asset limit; not uploaded"
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease --title "Prebuilt MIPRE modules (rolling)" \
            --notes "Compiled .lake/build for the modules of this repository, republished on every push to main. Consumed by .claude/cloud-setup.sh and .claude/hooks/lean-warm.sh; see docs/lean-cloud.md. The tag is a fixed anchor, not a version: only the attached asset moves." \
            || true
          gh release upload "$TAG" mipre-build.tar.zst --clobber
