name: Intentions

# Task-claiming automation, following the FLT project. One workflow drives the whole
# "MIPRE Formalization" board: contributors comment `claim` / `disclaim` / `propose #N` /
# `withdraw #N` on issues (command mode), and issue/PR lifecycle events auto-add new
# issues to the board and move cards as PRs open, merge, or close — no native GitHub
# Project workflows needed.
# See https://github.com/leanprover-community/intentions for details.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
jobs:
  intentions:
    permissions:
      issues: write
      pull-requests: write
    uses: leanprover-community/intentions/.github/workflows/intentions.yml@v1
    with:
      project-title: "MIPRE Formalization"
      default-ttl: "none"
    secrets:
      project-token: ${{ secrets.PAT_TOKEN }}
